name: Python quality
on:
  pull_request:
  push:
    branches: [main, codex/full-development-workflow]
permissions:
  contents: read
jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Formatting (read-only)
        run: ruff format --check .
      - name: Lint (read-only)
        run: ruff check .
      - name: Offline toolbox regression (not product acceptance)
        run: python -m unittest discover -s tests -p 'test_*.py' -b
