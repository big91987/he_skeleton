name: 交给 Agent 处理研发任务
description: 提交需求、文档、原型、代码修改或验证任务；产品形式由项目决定
title: '[任务] '
labels: ['harness']
body:
  - type: markdown
    attributes:
      value: '说明目标和已有材料即可，不限定产品类型或技术栈。当前仅仓库所有者能触发执行；环境或验证能力不足时会明确反馈。'
  - type: dropdown
    id: start
    attributes:
      label: 开始方式
      options:
        - 先澄清（本轮不改代码）
        - 直接实施
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 想完成什么
      description: 描述目标、范围、约束和需要交付的内容，不必预先选择产品类型。
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: 已有材料
      description: 填写仓库内 PRD、AC、设计、原型、代码或相关 PR 的位置；外部材料需说明如何访问。
  - type: textarea
    id: acceptance
    attributes:
      label: 如何判断完成
      description: 写出期望行为、验收标准、已有测试入口及运行环境要求。
