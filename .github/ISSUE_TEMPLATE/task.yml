name: 交给 Agent 做一个网页
description: 真实 Codex 执行、澄清、浏览器检查、预览和反馈续跑
title: '[实验] '
labels: ['harness']
body:
  - type: markdown
    attributes:
      value: '当前仅仓库所有者可以触发本地执行。第一版支持 HTML/CSS/JS 静态网页和浏览器本地存储，不支持真实后端或账号系统。'
  - type: dropdown
    id: start
    attributes:
      label: 开始方式
      options:
        - 先澄清（本轮不改代码）
        - 直接实施
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 想做什么
      description: 用业务语言描述需求。已有代码可在同仓库 PR 评论 /harness 接管。
      placeholder: 做一个待办清单，能创建、完成、删除任务，刷新后不丢。如果有重要问题，先问我。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 我准备怎么体验
      placeholder: 新增一条任务，完成它，刷新页面，确认状态保留。
