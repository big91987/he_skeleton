name: Harness task
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Existing Issue or same-repository PR number'
        required: true
        type: string
      instruction:
        description: 'Instruction / response to clarification'
        required: true
        default: '继续检查'
        type: string
env:
  HARNESS_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'codex/harness-test-') && github.ref_name || '' }}
permissions:
  contents: read
concurrency:
  group: harness-preview-${{ github.actor == github.repository_owner && 'owner' || github.run_id }}
  cancel-in-progress: false
jobs:
  work:
    if: >-
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/harness-test-'))) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'harness')) ||
       (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/harness')))
    runs-on: [self-hosted, macOS, ARM64, he-skeleton]
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      publish: ${{ steps.task.outputs.publish }}
      task: ${{ steps.task.outputs.task }}
    steps:
      - name: Download exact execution revision
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 - <<'PYCODE'
          import io, os, subprocess, tarfile, tempfile
          from pathlib import Path
          data = subprocess.run(['gh','api','repos/' + os.environ['GITHUB_REPOSITORY'] + '/tarball/' + os.environ['GITHUB_SHA']], capture_output=True, check=True, timeout=90).stdout
          root = Path(tempfile.mkdtemp(prefix='harness-source-', dir=os.environ['RUNNER_TEMP']))
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for entry in archive.getmembers():
                  parts = Path(entry.name).parts[1:]
                  if not parts:
                      continue
                  target = root.joinpath(*parts)
                  if not target.resolve().is_relative_to(root):
                      raise ValueError('Snapshot path escapes source directory')
                  if entry.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif entry.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.extractfile(entry).read())
                  else:
                      raise ValueError('Snapshot contains unsupported link')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('HARNESS_SOURCE=' + str(root) + '\n')
          PYCODE
      - name: Execute persistent task
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_ROOT: ${{ runner.workspace }}/../..
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 "$HARNESS_SOURCE/harness/loop.py"
      - name: Upload public task result
        if: steps.task.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task-result
          path: ${{ runner.temp }}/harness-output/result.json
          retention-days: 14
      - name: Package retained previews without platform tar dependencies
        if: steps.task.outputs.publish == 'true'
        env:
          HARNESS_ROOT: ${{ runner.workspace }}/../..
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 - <<'PYCODE'
          import os, tarfile, tempfile, shutil
          from pathlib import Path
          root = Path(os.environ['HARNESS_ROOT']).resolve()
          roots = [('main', root / 'previews')]
          roots += [('experiments/' + p.name, p / 'previews') for p in (root / 'experiments').glob('*') if p.is_dir()]
          stage = Path(tempfile.mkdtemp(prefix='delivery-site-', dir=os.environ['RUNNER_TEMP']))
          (stage / 'index.html').write_text('<!doctype html><meta charset="utf-8"><title>交付证据</title><h1>交付证据</h1><p>请从对应 Issue 或 PR 的交付卡片访问具体版本。</p>')
          for prefix, preview in roots:
              for path in sorted(preview.rglob('*')):
                  if path.is_symlink():
                      raise ValueError('Delivery archive must not contain symlinks')
                  if path.is_file():
                      dest = stage / prefix / path.relative_to(preview)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, dest)
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'artifact.tar', 'w', format=tarfile.GNU_FORMAT) as archive:
              archive.add(stage, arcname='.')
          PYCODE
      - name: Upload Pages archive
        if: steps.task.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          compression-level: 0
          retention-days: 1
  publish:
    needs: work
    if: needs.work.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      issues: write
      pull-requests: write
      contents: read
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: harness-evidence
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: task-result
          path: result
      - name: Publish persistent preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish verified delivery card to Issue and PR
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 harness/delivery.py result/result.json --base-url "$PAGE_URL"
      - name: Report preview deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ needs.work.outputs.task }}
        run: |
          gh issue comment "$TASK" --repo "$GITHUB_REPOSITORY" --body "预览发布未完成，不能当成可访问预览。请在本次 Actions 运行中重试失败的发布 Job；代码和本地任务检查点仍保留。"

  record:
    needs: [work, publish]
    if: always() && needs.work.outputs.publish == 'true'
    runs-on: [self-hosted, macOS, ARM64, he-skeleton]
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Persist deployment outcome
        env:
          HARNESS_ROOT: ${{ runner.workspace }}/../..
          TASK: ${{ needs.work.outputs.task }}
          DEPLOY_RESULT: ${{ needs.publish.result }}
          PAGE_URL: ${{ needs.publish.outputs.page_url }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          python3 - <<'PYCODE'
          import fcntl, json, os
          from pathlib import Path
          assert os.environ['TASK'].isdigit()
          root = Path(os.environ['HARNESS_ROOT']).resolve()
          if os.environ.get('HARNESS_EXPERIMENT'):
              import hashlib
              root = root / 'experiments' / hashlib.sha256(os.environ['HARNESS_EXPERIMENT'].encode()).hexdigest()[:16]
          session = root / 'sessions' / os.environ['TASK']
          with (session / 'lock').open('w') as lock:
              fcntl.flock(lock, fcntl.LOCK_EX)
              p = session / 'state.json'
              state = json.loads(p.read_text())
              if state.get('run_id') == os.environ['GITHUB_RUN_ID']:
                  state['status'] = 'waiting_review' if os.environ['DEPLOY_RESULT'] == 'success' else 'preview_failed'
                  state['page_url'] = os.environ['PAGE_URL']
                  tmp = p.with_suffix('.tmp')
                  tmp.write_text(json.dumps(state, ensure_ascii=False, indent=2))
                  tmp.replace(p)
          PYCODE
