name: Light development workflow
on:
  workflow_dispatch:
    inputs:
      task:
        description: Existing Issue number
        type: string
        required: true
      instruction:
        description: Optional natural-language message
        type: string
        default: ''
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: light-development-${{ github.repository }}-${{ github.event.issue.number || inputs.task }}
  cancel-in-progress: false
  queue: max
env:
  FULL_STATE_ROOT: ${{ vars.FULL_STATE_ROOT }}
  NODE_PATH: ${{ vars.FULL_NODE_PATH }}
jobs:
  authorize:
    if: >-
      github.event.sender.type != 'Bot' && !github.event.issue.pull_request &&
      !startsWith(github.event.comment.body, '<!-- harness-event:') &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Verify repository permissions before local execution
        id: permission
        uses: actions/github-script@v7
        with:
          script: |
            async function allowed(username) {
              if (!username || username.endsWith('[bot]')) return false;
              if (username.toLowerCase() === context.repo.owner.toLowerCase()) return true;
              try {
                const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
                return ['admin', 'maintain', 'write'].includes(data.permission);
              } catch (error) {
                if (error.status === 403 || error.status === 404) return false;
                throw error;
              }
            }
            const actors = [...new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR || context.actor])];
            const permitted = (await Promise.all(actors.map(allowed))).every(Boolean);
            core.setOutput('allowed', String(permitted));
            await core.summary.addRaw(permitted ? 'Authorized contributor: continue on the project Runner.' : 'Waiting for a contributor with write, maintain or admin permission to start the task from Actions.').write();
  restore:
    needs: [authorize]
    if: >-
      needs.authorize.outputs.allowed == 'true'
    # Keep all stage jobs on the same persistent Runner.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore saved stage · no model call
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHT_PUBLIC: ${{ runner.temp }}/light-public-${{ github.run_id }}-restore
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure FULL_STATE_ROOT first'; exit 1; }
          python3 full_harness/light.py restore --wait-seconds 18000
  requirements:
    needs: [restore]
    if: >-
      needs.restore.result == 'success' && needs.restore.outputs.stage == 'requirements'
    # Keep all stage jobs on the same persistent Runner.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      next_stage: ${{ steps.stage.outputs.next_stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Requirements · resume Session
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHT_PUBLIC: ${{ runner.temp }}/light-public-${{ github.run_id }}-requirements
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure FULL_STATE_ROOT first'; exit 1; }
          python3 full_harness/light.py requirements --wait-seconds 18000
      - name: Download requirements documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-${{ github.run_id }}-requirements
          path: ${{ runner.temp }}/light-public-${{ github.run_id }}-requirements
          if-no-files-found: ignore
          retention-days: 30
  design:
    needs: [restore, requirements]
    if: >-
      !cancelled() && needs.restore.result == 'success' &&
      needs.requirements.result != 'failure' && needs.requirements.result != 'cancelled' &&
      (needs.restore.outputs.stage == 'design' || needs.requirements.outputs.next_stage == 'design')
    # Keep all stage jobs on the same persistent Runner.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      next_stage: ${{ steps.stage.outputs.next_stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Design · resume Session
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHT_PUBLIC: ${{ runner.temp }}/light-public-${{ github.run_id }}-design
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure FULL_STATE_ROOT first'; exit 1; }
          python3 full_harness/light.py design --wait-seconds 18000
      - name: Download design documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-${{ github.run_id }}-design
          path: ${{ runner.temp }}/light-public-${{ github.run_id }}-design
          if-no-files-found: ignore
          retention-days: 30
  development:
    needs: [restore, requirements, design]
    if: >-
      !cancelled() && needs.restore.result == 'success' &&
      needs.requirements.result != 'failure' && needs.requirements.result != 'cancelled' &&
      needs.design.result != 'failure' && needs.design.result != 'cancelled' &&
      (needs.restore.outputs.stage == 'development' || needs.design.outputs.next_stage == 'development')
    # Keep all stage jobs on the same persistent Runner.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      next_stage: ${{ steps.stage.outputs.next_stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Development · implement, check and repair
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHT_PUBLIC: ${{ runner.temp }}/light-public-${{ github.run_id }}-development
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure FULL_STATE_ROOT first'; exit 1; }
          python3 full_harness/light.py development --wait-seconds 18000
      - name: Download development documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-${{ github.run_id }}-development
          path: ${{ runner.temp }}/light-public-${{ github.run_id }}-development
          if-no-files-found: ignore
          retention-days: 30
