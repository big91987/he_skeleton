name: Full development workflow
on:
  workflow_dispatch:
    inputs:
      task:
        description: Existing Issue number
        type: string
        required: true
      instruction:
        description: Optional natural-language message
        type: string
        default: ''
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: full-development-${{ github.repository }}
  cancel-in-progress: false
env:
  FULL_STATE_ROOT: ${{ vars.FULL_STATE_ROOT }}
jobs:
  authorize:
    if: >-
      github.event.sender.type != 'Bot' && !github.event.issue.pull_request &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'issue_comment')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Verify repository permissions before local execution
        id: permission
        uses: actions/github-script@v7
        with:
          script: |
            async function allowed(username) {
              if (!username || username.endsWith('[bot]')) return false;
              if (username.toLowerCase() === context.repo.owner.toLowerCase()) return true;
              try {
                const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
                return ['admin', 'maintain', 'write'].includes(data.permission);
              } catch (error) {
                if (error.status === 403 || error.status === 404) return false;
                throw error;
              }
            }
            const actors = [...new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR || context.actor])];
            const permitted = (await Promise.all(actors.map(allowed))).every(Boolean);
            core.setOutput('allowed', String(permitted));
            await core.summary.addRaw(permitted ? 'Authorized contributor: continue on the project Runner.' : 'Waiting for a contributor with write, maintain or admin permission to comment or start the task.').write();
  entry:
    needs: [authorize]
    if: needs.authorize.outputs.allowed == 'true'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      run_requirements: ${{ steps.stage.outputs.run_requirements }}
      run_design: ${{ steps.stage.outputs.run_design }}
      run_development: ${{ steps.stage.outputs.run_development }}
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: entry
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-entry
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
          python3 full_harness/runner.py entry
      - name: Downloadable stage documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_id }}-entry
          path: ${{ runner.temp }}/full-public-${{ github.run_id }}-entry
          if-no-files-found: ignore
          retention-days: 30
  requirements:
    needs: [entry]
    if: >-
      always() && needs.entry.result == 'success' && needs.entry.outputs.run_requirements == 'true'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: requirements
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-requirements
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
          python3 full_harness/runner.py requirements
      - name: Downloadable stage documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_id }}-requirements
          path: ${{ runner.temp }}/full-public-${{ github.run_id }}-requirements
          if-no-files-found: ignore
          retention-days: 30
  design:
    needs: [entry, requirements]
    if: >-
      always() && needs.entry.result == 'success' && needs.entry.outputs.run_design == 'true' &&
      needs.requirements.result != 'failure' && needs.requirements.result != 'cancelled' && needs.requirements.outputs.continue != 'false'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: design
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-design
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
          python3 full_harness/runner.py design
      - name: Downloadable stage documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_id }}-design
          path: ${{ runner.temp }}/full-public-${{ github.run_id }}-design
          if-no-files-found: ignore
          retention-days: 30
  development:
    needs: [entry, requirements, design]
    if: >-
      always() && needs.entry.result == 'success' && needs.entry.outputs.run_development == 'true' &&
      needs.requirements.result != 'failure' && needs.requirements.result != 'cancelled' && needs.requirements.outputs.continue != 'false' &&
      needs.design.result != 'failure' && needs.design.result != 'cancelled' && needs.design.outputs.continue != 'false'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: development
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-development
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
          python3 full_harness/runner.py development
      - name: Downloadable stage documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_id }}-development
          path: ${{ runner.temp }}/full-public-${{ github.run_id }}-development
          if-no-files-found: ignore
          retention-days: 30
  report:
    needs: [entry, requirements, design, development]
    if: >-
      always() && needs.entry.result == 'success'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: report
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-report
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
          python3 full_harness/runner.py report
      - name: Downloadable stage documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_id }}-report
          path: ${{ runner.temp }}/full-public-${{ github.run_id }}-report
          if-no-files-found: ignore
          retention-days: 30
