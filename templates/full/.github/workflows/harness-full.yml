      needs.design.result != 'failure' && needs.design.result != 'cancelled' && needs.design.outputs.continue != 'false'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
