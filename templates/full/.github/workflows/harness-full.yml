name: Full development workflow
on:
  workflow_dispatch:
    inputs:
      task:
        description: Existing Issue number
        type: string
        required: true
      instruction:
        description: Instruction, or reply token followed by answer
        type: string
        default: ''
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: full-development-${{ github.repository }}
  cancel-in-progress: false
env:
  FULL_STATE_ROOT: ${{ vars.FULL_STATE_ROOT }}
jobs:
  entry:
    if: >-
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'harness-full')) ||
       (github.event_name == 'issue_comment' && (github.event.comment.body == '/develop' || startsWith(github.event.comment.body, '/develop '))))
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      run_requirements: ${{ steps.stage.outputs.run_requirements }}
      run_design: ${{ steps.stage.outputs.run_design }}
      run_plan: ${{ steps.stage.outputs.run_plan }}
      run_implementation: ${{ steps.stage.outputs.run_implementation }}
      run_verification: ${{ steps.stage.outputs.run_verification }}
      run_review: ${{ steps.stage.outputs.run_review }}
      run_delivery: ${{ steps.stage.outputs.run_delivery }}
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: entry
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-entry
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
          python3 full_harness/runner.py entry
      - name: Downloadable stage documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_id }}-entry
          path: ${{ runner.temp }}/full-public-${{ github.run_id }}-entry
          if-no-files-found: ignore
          retention-days: 30
  requirements:
    needs: [entry]
    if: >-
      always() && needs.entry.result == 'success' && needs.entry.outputs.run_requirements == 'true'
    # All jobs must select the SAME persistent machine. Give only that Runner
    # this unique label, and set FULL_STATE_ROOT to a private directory outside
    # the checkout. Other OSes require changing these Owner-owned labels.
    runs-on: [self-hosted, macOS, ARM64, he-full]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      continue: ${{ steps.stage.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: requirements
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_PUBLIC: ${{ runner.temp }}/full-public-${{ github.run_id }}-requirements
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          test -n "$FULL_STATE_ROOT" || { echo 'Configure private FULL_STATE_ROOT and the unique he-full Runner label first'; exit 1; }
